<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light only">
<title>Bản đồ UBND TP.HCM - Mùa Hè Xanh 2026</title>
<link rel="icon" type="image/x-icon" href="Logo/logo MHX_DHSG.png" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol/dist/L.Control.Locate.min.js" charset="utf-8"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    
</head>
<body>

    <!-- Đầu trang -->
    <header id="header">
        <h1>Bản đồ UBND các phường mới TP.HCM</h1>
        <div id="search-box">
            <input type="text" id="searchInput" placeholder="Nhập tên phường tìm kiếm" autocomplete="off" />
        </div>
    </header>

    <!-- Hướng dẫn nhanh -->
    <div id="quick-guide">
        <span>Tìm phường | Chọn bán kính | Nhấn nút định vị để tìm UBND gần bạn</span>
    </div>

    <!-- Chọn bán kính -->
    <div id="radius-selector">
        <span>Bán kính tìm:</span>
        <button class="radius-btn active" data-radius="5">5km</button>
        <button class="radius-btn" data-radius="10">10km</button>
        <button class="radius-btn" data-radius="15">15km</button>
    </div>

    <!-- Vùng gợi ý (mặc định ẩn) -->
    <div id="suggestions" style="display:none;">
        <div id="suggestions-header">
            <strong>Các UBND gần bạn (trong 5km):</strong>
            <button id="closeSuggestions">x</button>
        </div>
        <div id="suggestions-list"></div>
    </div>

    <!-- Bản đồ -->
    <div id="map"></div>

    <!-- Chân trang -->
    <footer id="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <img src="Logo/logo DHSG_MHX_LOGO MHX.png" alt="Logo Đại học Sài Gòn" />
            </div>
            <div class="footer-text">
                <span>Đội Bình Dân Học Vụ Số - Mùa Hè Xanh</span>
                <span>Trường Đại học Sài Gòn</span>
                <span>2026 - Dữ liệu từ Nghị quyết 1685</span>
            </div>
        </div>
    </footer>

    <!-- Script chính -->
    <script src="script.js"></script>
</body>
</html>
